<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HOMEOPLUSS • Registration</title><style>body{margin:0;font-family:Arial;background:linear-gradient(135deg,#eefcff,#fff);color:#123}.wrap{min-height:100vh;padding:20px;display:grid;place-items:center}.card{width:min(850px,96vw);background:#fff;border:1px solid #d8edf1;border-radius:24px;padding:24px;box-shadow:0 15px 45px #075d8318}.brand{font-size:30px;font-weight:900;color:#025da3}.tag{color:#00a8b3;font-weight:700}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.f{display:flex;flex-direction:column;gap:6px}.f label{font-size:12px;font-weight:800;color:#456}.f input,.f select,.f textarea{padding:13px;border:1px solid #c9dfe5;border-radius:12px;font-size:15px}.full{grid-column:1/-1}.btn{border:0;padding:14px;border-radius:13px;background:linear-gradient(135deg,#025da3,#00a8b3);color:#fff;font-weight:900;cursor:pointer}.btn.alt{background:#fff;color:#025da3;border:1px solid #c5e0e6}.note{padding:12px;background:#f3fbfd;border-radius:12px;margin:14px 0}.modal{position:fixed;inset:0;background:#002b3d99;display:none;place-items:center}.modal.show{display:grid}.box{background:#fff;padding:30px;border-radius:24px;text-align:center;width:min(450px,90vw)}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><div class="wrap"><div class="card"><div class="brand" id="brand">HOMEOPLUSS</div><div class="tag" id="tag"></div><h2>NEW PATIENT REGISTRATION</h2><div class="note">Welcome Health Points: <b id="whp">2000</b> HP <span id="wstatus"></span><br><small>Welcome HP is controlled by Master Admin. Earned HP starts at 0.</small></div><form id="form"><div class="grid"><div class="f"><label>FULL NAME *</label><input id="name" required></div><div class="f"><label>GENDER *</label><select id="gender" required><option value="">Select</option><option>Male</option><option>Female</option><option>Other</option></select></div><div class="f"><label>DATE OF BIRTH *</label><input id="dob" type="date" required></div><div class="f"><label>AGE (AUTO)</label><input id="age" readonly></div><div class="f"><label>MOBILE NUMBER *</label><input id="mobile" maxlength="10" inputmode="numeric" required></div><div class="f"><label>SOURCE</label><select id="source"><option>Online</option><option>Walk-in</option><option>Reference</option></select></div><div class="f"><label>REFERRAL ID</label><input id="ref" placeholder="Existing patient ID"></div><div class="f full"><label>ADDRESS</label><textarea id="address" rows="3"></textarea></div></div><p id="msg" style="color:#c33;font-weight:700"></p><button class="btn" type="submit">REGISTER PATIENT</button><button class="btn alt" type="button" id="back" style="margin-left:8px">BACK</button></form></div></div><div class="modal" id="modal"><div class="box"><div style="font-size:58px;color:#08a96a">✓</div><h2>REGISTRATION SUCCESSFUL</h2><p id="success"></p><button class="btn" id="go">GO TO HEALTH BOOK</button></div></div><script>
const K={P:'HPKYC_PATIENTS',S:'HPKYC_SETTINGS',C:'HPKYC_CURRENT_PATIENT'};const def={clinicName:'HOMEOPLUSS',tagline:'Homeopathy – Caring Naturally Since 1796',welcomeEnabled:true,welcomeHP:2000,earnedCap:500,schemes:{}};function get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}}function set(k,v){localStorage.setItem(k,JSON.stringify(v))}function $(x){return document.getElementById(x)}let s=get(K.S,def);s={...def,...s};$('brand').textContent=s.clinicName;$('tag').textContent=s.tagline;$('whp').textContent=s.welcomeEnabled?s.welcomeHP:0;$('wstatus').textContent=s.welcomeEnabled?'':' (OFF)';$('dob').onchange=()=>{let d=new Date($('dob').value),now=new Date();if(isNaN(d))return;let a=now.getFullYear()-d.getFullYear();if(now<new Date(now.getFullYear(),d.getMonth(),d.getDate()))a--; $('age').value=Math.max(0,a)};$('back').onclick=()=>location.href='index.html';$('form').onsubmit=e=>{e.preventDefault();let name=$('name').value.trim(),g=$('gender').value,d=$('dob').value,m=$('mobile').value.trim(),a=$('address').value.trim(),source=$('source').value,ref=$('ref').value.trim();if(!name||!g||!d||!/^[0-9]{10}$/.test(m)){ $('msg').textContent='Please complete all required fields correctly.';return}let year=d.slice(0,4),reg='HP-'+m+'-'+year,ps=get(K.P,[]);if(ps.some(p=>p.regNo===reg)){ $('msg').textContent='PATIENT ALREADY REGISTERED FOR THIS MOBILE + BIRTH YEAR.';return}if(ref&&!ps.some(p=>p.regNo===ref||p.id===ref)){ $('msg').textContent='PATIENT NOT FOUND — invalid referral ID.';return}let p={id:'P'+Date.now().toString(36).toUpperCase(),regNo:reg,name,gender:g,dob:d,dobYear:year,age:+$('age').value,mobile:m,address:a,source,referralId:ref,referralStatus:ref?'Pending':'None',welcomeHP:s.welcomeEnabled?Number(s.welcomeHP||0):0,earnedHP:0,visits:0,ledger:[],appointments:[],communications:[],notes:[],prescription:[],createdAt:new Date().toISOString()};ps.push(p);set(K.P,ps);set(K.C,p.id);$('success').innerHTML='Permanent Registration No:<br><b style="color:#025da3;font-size:20px">'+reg+'</b><br>Welcome HP: <b>'+p.welcomeHP+'</b>';$('modal').classList.add('show');$('go').onclick=()=>location.href='patient-health-book.html'};
</script></body></html>
