<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HOMEOPLUSS • Health Book</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f2fbfd;color:#123}.top{padding:16px 22px;background:#fff;border-bottom:1px solid #d8edf1;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;font-size:25px;color:#025da3}.wrap{padding:18px;max-width:1200px;margin:auto}.hero{background:linear-gradient(135deg,#025da3,#00a8b3);color:#fff;border-radius:22px;padding:20px;box-shadow:0 12px 30px #025da333}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:14px 0}.stat{background:#fff;border-radius:17px;padding:18px;border:1px solid #d9edf2}.num{font-size:28px;font-weight:900;color:#025da3}.panel{background:#fff;border-radius:18px;padding:18px;margin-top:14px;border:1px solid #d9edf2}.btn{border:0;border-radius:12px;padding:11px 15px;font-weight:900;cursor:pointer;background:#025da3;color:#fff}.btn.alt{background:#fff;color:#025da3;border:1px solid #c5e0e6}@media(max-width:800px){.cards{grid-template-columns:repeat(2,1fr)}.top{gap:10px}}@media(max-width:480px){.cards{grid-template-columns:1fr 1fr}.wrap{padding:10px}}
</style></head><body><header class="top"><div><div class="brand" id="brand">HOMEOPLUSS</div><small id="tag"></small></div><div><button class="btn alt" onclick="location.href='patient-admin.html'">ADMIN</button> <button class="btn" id="logout">LOGOUT</button></div></header><main class="wrap"><section class="hero"><h1 id="name">Patient</h1><div id="reg"></div><div id="contact"></div></section><section class="cards"><div class="stat"><small>WELCOME HP</small><div class="num" id="welcome">0</div></div><div class="stat"><small>EARNED HP</small><div class="num" id="earned">0</div></div><div class="stat"><small>TOTAL HP</small><div class="num" id="total">0</div></div><div class="stat"><small>REMAINING EARNED CAP</small><div class="num" id="remain">0</div></div></section><section class="panel"><h3>PROFILE</h3><div id="profile"></div></section><section class="panel"><h3>APPOINTMENTS</h3><div id="appointments">No appointments yet.</div></section><section class="panel"><h3>HEALTH POINT LEDGER</h3><div id="ledger">No earned HP transactions.</div></section><section class="panel"><h3>COMMUNICATION HISTORY</h3><div id="comms">No communications yet.</div></section></main><script>
const K={P:'HPKYC_PATIENTS',S:'HPKYC_SETTINGS',C:'HPKYC_CURRENT_PATIENT'};function get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}}function set(k,v){localStorage.setItem(k,JSON.stringify(v))}function $(x){return document.getElementById(x)}let id=get(K.C,null),ps=get(K.P,[]),p=ps.find(x=>x.id===id);if(!p){alert('Patient session not found. Please login.');location.href='index.html'}else{let s=get(K.S,{}),cap=Number(s.earnedCap??500);$('brand').textContent=s.clinicName||'HOMEOPLUSS';$('tag').textContent=s.tagline||'';$('name').textContent=p.name;$('reg').textContent=p.regNo;$('contact').textContent=p.mobile+' • '+p.gender+' • Age '+p.age;$('welcome').textContent=p.welcomeHP||0;$('earned').textContent=p.earnedHP||0;$('total').textContent=(p.welcomeHP||0)+(p.earnedHP||0);$('remain').textContent=Math.max(0,cap-(p.earnedHP||0));$('profile').innerHTML='<b>DOB:</b> '+p.dob+'<br><b>Address:</b> '+(p.address||'—')+'<br><b>Source:</b> '+(p.source||'—')+'<br><b>Referral:</b> '+(p.referralStatus||'None')+'<br><b>Visits:</b> '+(p.visits||0);$('appointments').innerHTML=(p.appointments||[]).length?(p.appointments||[]).map(a=>'<div style="padding:10px;border-bottom:1px solid #eee"><b>'+a.date+' '+a.time+'</b> • '+a.status+'</div>').join(''):'No appointments yet.';$('ledger').innerHTML=(p.ledger||[]).length?(p.ledger||[]).slice().reverse().map(x=>'<div style="padding:10px;border-bottom:1px solid #eee"><b>+'+x.points+' HP</b> • '+x.reason+' • '+new Date(x.at).toLocaleString()+'</div>').join(''):'No earned HP transactions.';$('comms').innerHTML=(p.communications||[]).length?(p.communications||[]).slice().reverse().map(x=>'<div style="padding:10px;border-bottom:1px solid #eee"><b>'+x.type+'</b> • '+x.status+' • '+new Date(x.at).toLocaleString()+'</div>').join(''):'No communications yet.'}$('logout').onclick=()=>{localStorage.removeItem(K.C);location.href='index.html'};
</script></body></html>
