<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HOMEOPLUSS • Doctor Panel</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f1fbfd;color:#123}.top{padding:15px 20px;background:#fff;border-bottom:1px solid #d7edf1;display:flex;justify-content:space-between;align-items:center}.brand{font-size:25px;font-weight:900;color:#025da3}.wrap{max-width:1300px;margin:auto;padding:16px}.grid{display:grid;grid-template-columns:310px 1fr;gap:14px}.card{background:#fff;border:1px solid #d9edf2;border-radius:18px;padding:17px}.f{display:flex;flex-direction:column;gap:5px;margin:8px 0}.f label{font-size:11px;font-weight:900;color:#456}.f input,.f textarea,.f select{padding:11px;border:1px solid #c9dfe5;border-radius:10px}.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:900;background:#025da3;color:#fff;cursor:pointer}.btn.alt{background:#fff;color:#025da3;border:1px solid #c5e0e6}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{padding:8px 10px;border-radius:10px;background:#eaf9fb;color:#025da3;font-weight:900;font-size:12px}.preview{white-space:pre-wrap;background:#f8fcff;border:1px solid #dcecf1;border-radius:12px;padding:14px;min-height:200px}.modal{position:fixed;inset:0;background:#002b3d99;display:none;place-items:center}.modal.show{display:grid}.box{background:#fff;padding:25px;border-radius:20px;width:min(500px,92vw)}@media(max-width:900px){.grid{grid-template-columns:1fr}}
</style></head><body><header class="top"><div><div class="brand" id="brand">HOMEOPLUSS</div><small id="tag"></small></div><button class="btn alt" onclick="location.href='index.html'">LOGOUT</button></header><main class="wrap"><div id="app" style="display:none"><div class="grid"><aside class="card"><h3>PATIENT SEARCH</h3><div class="f"><label>MOBILE / REG NO / NAME</label><input id="search"></div><div id="results"></div><hr><div id="selected">Select a patient.</div></aside><section><div class="card"><h3 id="pname">PATIENT</h3><div id="pinfo">No patient selected.</div><div class="chips" id="hp"></div></div><div class="card" style="margin-top:14px"><h3>CONSULTATION</h3><div class="f"><label>DOCTOR NOTES</label><textarea id="notes" rows="4"></textarea></div><div class="row"><div class="f"><label>FOLLOW-UP DATE</label><input id="fd" type="date"></div><div class="f"><label>FOLLOW-UP TIME</label><input id="ft" type="time"></div></div><button class="btn" id="saveConsult">SAVE CONSULTATION</button></div><div class="card" style="margin-top:14px"><h3>QUICK COMMUNICATION</h3><div class="chips" id="quick"></div><div class="f"><label>MESSAGE TYPE</label><select id="type"></select></div><div class="row"><div class="f"><label>APPOINTMENT DATE</label><input id="ad" type="date"></div><div class="f"><label>APPOINTMENT TIME</label><input id="at" type="time"></div></div><div class="row"><div class="f"><label>BILL NO</label><input id="bn"></div><div class="f"><label>BILL AMOUNT</label><input id="ba"></div></div><div class="row"><div class="f"><label>TRACKING NO</label><input id="tn"></div><div class="f"><label>OFFER / MESSAGE TEXT</label><input id="mt"></div></div><div class="preview" id="preview">Select a patient and communication type.</div><button class="btn" id="copy">COPY MESSAGE</button> <button class="btn" id="wa">OPEN WHATSAPP</button></div><div class="card" style="margin-top:14px"><h3>APPOINTMENTS</h3><button class="btn" id="book">SCHEDULE APPOINTMENT</button><div id="appts"></div></div></section></div></div></main><div class="modal" id="login"><div class="box"><h2>DOCTOR PANEL</h2><input id="pass" type="password" placeholder="Password" style="width:100%;padding:13px;border:1px solid #ccc;border-radius:10px"><button class="btn" id="unlock" style="margin-top:10px">UNLOCK</button></div></div><script>
const K={P:'HPKYC_PATIENTS',S:'HPKYC_SETTINGS'};function get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}}function set(k,v){localStorage.setItem(k,JSON.stringify(v))}function $(x){return document.getElementById(x)}let s=get(K.S,{}),ps=get(K.P,[]),p=null;let defaults={APPOINTMENT_CONFIRM:'Dear {{PATIENT_NAME}},\n\nYour doctor appointment at {{CLINIC_NAME}} is scheduled for {{APPOINTMENT_DATE}} at {{APPOINTMENT_TIME}}.\n\nPlease be on time.\n\nThank you,\nTeam {{CLINIC_NAME}}',APPOINTMENT_REMINDER:'Dear {{PATIENT_NAME}},\n\nThis is a reminder for your appointment at {{CLINIC_NAME}} on {{APPOINTMENT_DATE}} at {{APPOINTMENT_TIME}}.\n\nThank you,\nTeam {{CLINIC_NAME}}',APPOINTMENT_COMPLETED:'Dear {{PATIENT_NAME}},\n\nYour consultation at {{CLINIC_NAME}} has been completed successfully.\nYour next follow-up is scheduled for {{FOLLOWUP_DATE}} at {{FOLLOWUP_TIME}}.\n\nThank you,\nTeam {{CLINIC_NAME}}',FOLLOWUP_SCHEDULED:'Dear {{PATIENT_NAME}},\n\nYour follow-up at {{CLINIC_NAME}} is scheduled for {{FOLLOWUP_DATE}} at {{FOLLOWUP_TIME}}.\n\nThank you,\nTeam {{CLINIC_NAME}}',RX:'Dear {{PATIENT_NAME}},\n\nYour prescription / RX from {{CLINIC_NAME}} is ready.\n\nThank you,\nTeam {{CLINIC_NAME}}',BILL:'Dear {{PATIENT_NAME}},\n\nYour bill {{BILL_NO}} from {{CLINIC_NAME}} is generated. Amount: ₹{{BILL_AMOUNT}}.\n\nThank you,\nTeam {{CLINIC_NAME}}',PAYMENT_RECEIVED:'Dear {{PATIENT_NAME}},\n\nYour payment has been received by {{CLINIC_NAME}}. Thank you.\n\nTeam {{CLINIC_NAME}}',MEDICINE_DISPATCHED:'Dear {{PATIENT_NAME}},\n\nYour medicines from {{CLINIC_NAME}} have been dispatched successfully.\nCourier Tracking No: {{TRACKING_NO}}\n\nThank you,\nTeam {{CLINIC_NAME}}',TRACKING:'Dear {{PATIENT_NAME}},\n\nYour medicine courier tracking number is {{TRACKING_NO}}.\n\nTeam {{CLINIC_NAME}}',MEDICINE_DELIVERED:'Dear {{PATIENT_NAME}},\n\nYour medicines have been delivered successfully.\n\nThank you,\nTeam {{CLINIC_NAME}}',BIRTHDAY:'Dear {{PATIENT_NAME}},\n\nWishing you a very Happy Birthday from {{CLINIC_NAME}}. Stay healthy and happy!\n\nTeam {{CLINIC_NAME}}',ANNIVERSARY:'Dear {{PATIENT_NAME}},\n\nWarm wishes to you on your anniversary from {{CLINIC_NAME}}.\n\nTeam {{CLINIC_NAME}}',WISHES:'Dear {{PATIENT_NAME}},\n\nWarm wishes from {{CLINIC_NAME}}. Wishing you health, happiness and well-being.\n\nTeam {{CLINIC_NAME}}',OFFER:'Dear {{PATIENT_NAME}},\n\n{{OFFER_NAME}}\n{{OFFER_TEXT}}\n\nTeam {{CLINIC_NAME}}',DISCOUNT:'Dear {{PATIENT_NAME}},\n\nYou have a special discount of {{DISCOUNT}} at {{CLINIC_NAME}}.\n\nTeam {{CLINIC_NAME}}',HEALTH_DAY:'Dear {{PATIENT_NAME}},\n\n{{MESSAGE_TEXT}}\n\nTeam {{CLINIC_NAME}}',CUSTOM:'Dear {{PATIENT_NAME}},\n\n{{MESSAGE_TEXT}}\n\nTeam {{CLINIC_NAME}}',HP:'Dear {{PATIENT_NAME}},\n\nYour current HOMEOPLUSS Health Points are {{HP_TOTAL}} HP.\n\nTeam {{CLINIC_NAME}}',REPORT_READY:'Dear {{PATIENT_NAME}},\n\nYour health report is ready at {{CLINIC_NAME}}.\n\nTeam {{CLINIC_NAME}}',CONSULTATION_COMPLETED:'Dear {{PATIENT_NAME}},\n\nYour consultation at {{CLINIC_NAME}} has been completed successfully.\n\nThank you,\nTeam {{CLINIC_NAME}}',FOLLOWUP_REMINDER:'Dear {{PATIENT_NAME}},\n\nThis is a reminder for your follow-up on {{FOLLOWUP_DATE}} at {{FOLLOWUP_TIME}}.\n\nTeam {{CLINIC_NAME}}',CONSULTATION_REMINDER:'Dear {{PATIENT_NAME}},\n\nThis is a reminder for your consultation on {{APPOINTMENT_DATE}} at {{APPOINTMENT_TIME}}.\n\nTeam {{CLINIC_NAME}}'};const types=Object.keys(defaults);$('login').classList.add('show');$('unlock').onclick=()=>{if($('pass').value==='1008'){$('login').classList.remove('show');$('app').style.display='block';init()}else alert('Wrong password')};function init(){s=get(K.S,s);$('brand').textContent=s.clinicName||'HOMEOPLUSS';$('tag').textContent=s.tagline||'';$('type').innerHTML=types.map(x=>`<option>${x}</option>`).join('');$('quick').innerHTML=['APPOINTMENT_CONFIRM','APPOINTMENT_REMINDER','APPOINTMENT_COMPLETED','FOLLOWUP_SCHEDULED','RX','BILL','PAYMENT_RECEIVED','MEDICINE_DISPATCHED','TRACKING','MEDICINE_DELIVERED','BIRTHDAY','ANNIVERSARY','WISHES','OFFER','DISCOUNT','HEALTH_DAY','CUSTOM','HP','REPORT_READY'].map(x=>`<button class="chip" data-t="${x}">${x.replaceAll('_',' ')}</button>`).join('');document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{$('type').value=b.dataset.t;preview()});$('type').onchange=preview;['ad','at','fd','ft','bn','ba','tn','mt'].forEach(id=>$(id).oninput=preview);$('search').oninput=search}function search(){let q=$('search').value.toLowerCase();$('results').innerHTML=ps.filter(x=>(x.name+x.mobile+x.regNo).toLowerCase().includes(q)).slice(0,12).map(x=>`<button class="btn alt" style="display:block;width:100%;margin:5px 0;text-align:left" onclick="selectP('${x.id}')">${x.name} • ${x.mobile}<br><small>${x.regNo}</small></button>`).join('')}window.selectP=id=>{ps=get(K.P,[]);p=ps.find(x=>x.id===id);if(!p)return;$('pname').textContent=p.name;$('pinfo').innerHTML='<b>'+p.regNo+'</b> • '+p.mobile+' • '+p.gender+' • Age '+p.age;$('hp').innerHTML='<span class="chip">Welcome '+(p.welcomeHP||0)+' HP</span><span class="chip">Earned '+(p.earnedHP||0)+' HP</span><span class="chip">Total '+((p.welcomeHP||0)+(p.earnedHP||0))+' HP</span>';renderAppts();preview()};function vals(){return{PATIENT_NAME:p?.name||'',REG_NO:p?.regNo||'',APPOINTMENT_DATE:$('ad').value||'',APPOINTMENT_TIME:$('at').value||'',FOLLOWUP_DATE:$('fd').value||'',FOLLOWUP_TIME:$('ft').value||'',BILL_NO:$('bn').value||'',BILL_AMOUNT:$('ba').value||'',TRACKING_NO:$('tn').value||'',DOCTOR_NAME:'Doctor',HP_TOTAL:p?((p.welcomeHP||0)+(p.earnedHP||0)):0,OFFER_NAME:$('mt').value||'',OFFER_TEXT:$('mt').value||'',DISCOUNT:$('mt').value||'',MESSAGE_TEXT:$('mt').value||'',CLINIC_NAME:s.clinicName||'HOMEOPLUSS',CLINIC_PHONE:s.phone||'888 000 8224'}}function preview(){if(!p){$('preview').textContent='Select a patient.';return}let t=$('type').value,txt=(s.templates&&s.templates[t]&&s.templates[t].active!==false?s.templates[t].text:null)||defaults[t]||defaults.CUSTOM;let v=vals();txt=txt.replace(/{{([A-Z_]+)}}/g,(_,k)=>v[k]??'');$('preview').textContent=txt}function log(type,status){ps=get(K.P,[]);let x=ps.find(a=>a.id===p.id);x.communications=x.communications||[];x.communications.push({type,status,at:new Date().toISOString()});set(K.P,ps)}$('copy').onclick=async()=>{if(!p)return alert('Select patient');let txt=$('preview').textContent;await navigator.clipboard.writeText(txt);log($('type').value,'Prepared');alert('Message copied')};$('wa').onclick=()=>{if(!p)return alert('Select patient');let n=(p.mobile||'').replace(/\D/g,'');if(n.length!==10)return alert('Patient mobile number invalid');let url='https://wa.me/91'+n+'?text='+encodeURIComponent($('preview').textContent);log($('type').value,'Opened WhatsApp');window.open(url,'_blank')};$('saveConsult').onclick=()=>{if(!p)return alert('Select patient');ps=get(K.P,[]);let x=ps.find(a=>a.id===p.id);x.notes=x.notes||[];x.notes.push({text:$('notes').value,date:new Date().toISOString()});if($('fd').value){x.followup={date:$('fd').value,time:$('ft').value};}set(K.P,ps);p=x;alert('Consultation saved');};$('book').onclick=()=>{if(!p)return alert('Select patient');let d=$('ad').value,t=$('at').value;if(!d||!t)return alert('Enter appointment date and time');ps=get(K.P,[]);let x=ps.find(a=>a.id===p.id);x.appointments=x.appointments||[];x.appointments.push({date:d,time:t,status:'Scheduled'});set(K.P,ps);p=x;renderAppts();$('type').value='APPOINTMENT_CONFIRM';preview();alert('Appointment scheduled')};function renderAppts(){$('appts').innerHTML=(p?.appointments||[]).slice().reverse().map(a=>`<div style="padding:9px;border-bottom:1px solid #eee"><b>${a.date} ${a.time}</b> • ${a.status}</div>`).join('')||'No appointments.'}
</script></body></html>
